<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Choose Tickets | Theatre</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/style.css">
  </head>
  <body>
    <nav class="navbar site-nav">
      <div class="container-fluid px-4">
        <a class="navbar-brand brand" href="index.html">theatre</a>
        <button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#nav"><span class="navbar-toggler-icon"></span></button>
        <div class="collapse nav-menu" id="nav">
          <ul class="navbar-nav">
            <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
            <li class="nav-item"><a class="nav-link" href="calendar.html">Upcoming Shows</a></li>
            <li class="nav-item"><a class="nav-link" href="visit.html#getting-here">Getting Here</a></li>
            <li class="nav-item"><a class="nav-link" href="visit.html#contact">Contact Us</a></li>
            <li class="nav-item"><a class="nav-link" href="behind-the-curtain.html">Behind the Curtain</a></li>
            <li class="nav-item"><a class="nav-link active" href="cart.html">Cart</a></li>
          </ul>
        </div>
      </div>
    </nav>
    <main class="cal-page checkout">
      <div class="cal-layout checkout-layout">
        <section class="cal-left">
          <div class="month-head">
            <button class="month-btn" id="purchasePrevMonth">‹</button>
            <h1 id="purchaseMonthName"></h1>
            <button class="month-btn" id="purchaseNextMonth">›</button>
          </div>
          <div class="weekdays">
            <span>M</span><span>T</span><span>W</span><span>T</span><span>F</span><span>S</span><span>S</span>
          </div>
          <div class="day-grid" id="purchaseCalendarGrid"></div>
          <p class="small dim"><span class="show-dot"></span> Show dates</p>
        </section>
        <section class="cal-right">
          <div class="checkout-head">
            <div>
              <p class="eyebrow mb-1" id="purchaseSelectedDate">Choose a date</p>
              <h1 class="mb-0" id="purchaseShowTitle">Choose a show</h1>
            </div>
            <button class="btn btn-black" id="openCartPopup" type="button" data-bs-toggle="modal" data-bs-target="#cartModal">
              View Cart <span id="purchaseCartCount"></span>
            </button>
          </div>
          <div class="show-info" id="purchaseShowInfo"></div>
        </section>
      </div>
      <section class="show-picker">
        <h2>Shows</h2>
        <div class="show-grid" id="purchaseShowSelector"></div>
      </section>
    </main>
    <div class="modal fade" id="cartModal" tabindex="-1">
      <div class="modal-dialog cart-dialog">
        <div class="modal-content">
          <div class="modal-header">
            <h2 class="modal-title fs-4" id="cartModalTitle">Your Cart</h2>
            <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
          </div>
          <div class="modal-body">
            <div class="cart-list" id="cartModalItems"></div>
            <div class="cart-empty" id="cartModalEmpty" hidden>Your cart is empty. Add tickets to see them here.</div>
          </div>
          <div class="modal-footer justify-content-between">
            <button class="btn btn-outline-dark" id="clearCart" type="button">Clear Cart</button>
            <p class="mb-0">Total: <strong id="cartModalTotal">S$0.00</strong></p>
          </div>
        </div>
      </div>
    </div>
    <footer class="footer">
      <div class="container footer-row">
        <span>theatre</span>
        <a href="visit.html#contact">Contact us</a>
      </div>
    </footer>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/script.js"></script>
  </body>
</html>
